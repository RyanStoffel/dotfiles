# ~/.config/tmux/tmux.conf
#
# Deliberately close to stock tmux. Default prefix (Ctrl-b), default keys,
# default layout. Everything below is either a requested feature or a fix for
# a default that is actively wrong on a modern terminal.

# Requested: full mouse support. Click to focus a pane or window, drag borders
# to resize, scroll wheel enters copy mode.
set -g mouse on

# Fix: stock tmux advertises only 256 colors, so 24-bit color is silently
# quantized in Ghostty. tmux-256color carries the right terminfo, and the
# override re-enables truecolor for the outer TERM.
set -g default-terminal "tmux-256color"
set -as terminal-overrides ",xterm-256color:Tc"

# Fix: the stock 500ms escape-time makes tmux wait after every ESC, which
# reads as input lag in vim and neovim.
set -s escape-time 10

# Fix: 2000 lines of stock scrollback is less than one verbose build.
set -g history-limit 50000
