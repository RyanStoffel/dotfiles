theme:
  dark: catppuccin-mocha
  light: light
skills:
  customDirectories:
    - ~/.dotfiles/omp/skills
startup:
  quiet: true
defaultThinkingLevel: auto
symbolPreset: nerd
statusLine:
  preset: custom
  separator: powerline-thin
  sessionAccent: true
  transparent: true
  leftSegments:
    - model
    - path
    - git
  rightSegments:
    - usage
    - context_pct
  segmentOptions:
    model:
      showThinkingLevel: false
    path:
      abbreviate: true
      maxLength: 40
      stripWorkPrefix: true
    git:
      showBranch: true
      showStaged: true
      showUnstaged: true
      showUntracked: false
modelProviderOrder:
  - anthropic
  - openai-codex
  - google-antigravity
tools:
  approvalMode: yolo
providers:
  webSearchOrder:
    - anthropic
    - perplexity
    - gemini
    - codex
    - xai
    - zai
    - exa
    - tinyfish
    - jina
    - kagi
    - tavily
    - firecrawl
    - brave
    - kimi
    - parallel
    - synthetic
    - searxng
    - startpage
    - duckduckgo
    - ecosia
    - google
    - mojeek
    - public
setupVersion: 1
modelRoles:
  default: openai-codex/gpt-5.6-sol
enabledModels:
  - anthropic/claude-sonnet-5
  - anthropic/claude-opus-4-8
  - anthropic/claude-opus-5
  - google-antigravity/gemini-3.6-flash
  - openai-codex/gpt-5.6-sol
  - openai-codex/gpt-5.6-luna
  - openai-codex/gpt-5.6-terra
dev:
  autoqaConsent: granted