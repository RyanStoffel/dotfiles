# ~/.config/herdr/config.toml
#
# Generated from `herdr --default-config` (0.8.0), then trimmed to the
# settings that differ from stock. Keybindings are left at upstream defaults,
# which already use a tmux-style ctrl+b prefix.

# Config is managed here, so skip the first-run setup prompt.
onboarding = false

[terminal]
# Explicitly set interactive login shell so panes launch zsh with your Starship prompt,
# PATH, and dotfiles aliases loaded, rather than falling back to /bin/sh (-sh-3.2$).
default_shell = "/bin/zsh"
shell_mode = "login"

[theme]
# "terminal" inherits the host palette instead of shipping its own colors, so
# herdr matches the crt-mono palette in ghostty/config rather than fighting it.
# Stock default is catppuccin.
name = "terminal"

auto_switch = false
[theme.custom]
# "reset" leaves panel backgrounds transparent, so panels sit on the
# terminal's true black instead of a lighter painted panel color.
panel_bg = "reset"

[ui]
# Amber highlights, borders, and navigation UI, matching the terminal cursor.
# Stock accent is cyan.
accent = "#ffb000"

# Requested: mouse support. Click, drag to split, drag borders to resize.
mouse_capture = true

# Chrome removal. Borders stay on because they carry focus state; the gap and
# the scrollbar column are decoration.
pane_gaps = false
pane_scrollbars = false

# A tab row listing one tab is pure overhead.
hide_tab_bar_when_single_tab = true

# Stock sidebar rows lead with state_icon, which renders colored emoji circles.
# state_text spells the same state out as a word instead.
agent_panel_sort = "spaces"
show_agent_labels_on_pane_borders = true
[ui.sidebar.agents]
rows = [["state_text", "workspace", "tab"], ["agent"]]

[ui.sidebar.spaces]
rows = [["state_text", "workspace"], ["branch", "git_status"]]

[ui.sound]
# No mp3 playback on agent state changes.
enabled = false

[ui.toast]
delivery = "herdr"
